name: CI

on:
  push:
    branches: [rs]
  pull_request:
    branches: [rs]

jobs:
  test:
    name: Test with PostgreSQL (${{ matrix.pg_version }})
    strategy:
      fail-fast: false
      matrix:
        pg_version: [13, 14, 15, 16, 17, 18]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison \
            libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc ccache pkg-config

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
          dune-cache: false

      - name: Install dune
        run: |
          opam install -y dune
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Install cargo-pgrx
        run: |
          cargo install cargo-pgrx --version 0.19.1 --locked

      - name: Initialize pgrx for PostgreSQL ${{ matrix.pg_version }}
        run: |
          cargo pgrx init --pg${{ matrix.pg_version }} download

      - name: Run pgrx tests
        run: |
          cargo pgrx test --no-default-features --features pg${{ matrix.pg_version }} pg_test

      - name: Install extension and run ported pg_regress suite
        if: matrix.pg_version == 16
        run: |
          cargo pgrx install --no-default-features --features pg16
          cargo pgrx start pg16 || true
          export PGHOST=127.0.0.1 PGPORT=28816
          PG_BIN="$(dirname "$(python3 -c "import pathlib,re; t=pathlib.Path.home().joinpath('.pgrx','config.toml').read_text(); m=re.search(r'pg16\\s*=\\s*\\\"([^\\\"]+)\\\"', t); print(m.group(1) if m else '')")")"
          export PATH="$PG_BIN:$PATH"
          make installcheck PG_CONFIG="$PG_BIN/pg_config" || {
            echo "==== regression.diffs ===="
            cat regression.diffs || true
            exit 1
          }
